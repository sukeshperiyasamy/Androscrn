name: AndroScrn Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to GitHub Releases (set false for dry-run inspection build)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Windows Portable Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix apps/desktop ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium

      - name: Build Modules and Desktop Application
        run: npm run build

      - name: Run Complete Test Verification Suite
        run: npm test

      - name: Package Standalone Windows Portable Distribution
        run: npm run build:portable

      - name: Upload Build Artifacts for Inspection
        uses: actions/upload-artifact@v4
        with:
          name: AndroScrn-portable-win-x64
          path: |
            dist-release/AndroScrn-portable-win-x64.zip
            dist-release/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          name: AndroScrn ${{ github.ref_name }}
          files: |
            dist-release/AndroScrn-portable-win-x64.zip
            dist-release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
